# Tests and a real container start, on every push and pull request.
#
# The end-to-end test runs against the real Garage binary, taken out of the
# same image the Dockerfile copies it from, so the tested Garage is the
# shipped one.
name: Server

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test dependencies (signing the Cloudflare test tokens only)
        run: pip install -r server/requirements-test.txt
      - name: Garage binary from the image
        run: |
          version=$(sed -n 's/^ARG GARAGE_VERSION=//p' server/Dockerfile)
          id=$(docker create "dxflrs/garage:${version}")
          docker cp "$id:/garage" "$RUNNER_TEMP/garage"
          docker rm "$id"
      - name: Tests
        env:
          BLOCKSLOT_TEST_GARAGE: ${{ runner.temp }}/garage
        run: python -m unittest discover -v server/tests

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f server/Dockerfile -t blockslot-server:ci .
      - name: Start it and wait for healthy
        run: |
          docker run -d --name bs -p 8761:8761 blockslot-server:ci
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' bs)
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' bs)" = true ] || { docker logs bs; exit 1; }
            sleep 2
          done
          docker logs bs
          [ "$state" = healthy ] || exit 1
          curl -fsS http://127.0.0.1:8761/api/session | grep -q '"first_run": true'
      - name: Stops cleanly
        run: |
          docker stop -t 15 bs
          [ "$(docker inspect -f '{{.State.ExitCode}}' bs)" = 0 ]
