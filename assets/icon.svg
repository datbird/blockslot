  <g fill="#E9FFF9">
    <rect x="176" y="282" width="14" height="14" transform="skewY(30) translate(0 -101.6)"/>
    <rect x="198" y="282" width="14" height="14" transform="skewY(30) translate(0 -114.3)"/>
    <rect x="220" y="282" width="14" height="14" transform="skewY(30) translate(0 -127)" opacity="0.45"/>
