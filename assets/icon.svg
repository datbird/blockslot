<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-label="Blockslot">
  <!-- The designer's app icon (App icon-html.zip, 2026-09-25) with two
       changes: the arrow lines end flat, so their round cap no longer bulges
       past the arrowhead (a round dot keeps the tail end round), and the
       four corner squares are gone because they show at no real size. -->
