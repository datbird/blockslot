            markerHeight="2.5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#F6B23C"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#10141B"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#222A36" stroke-width="2"/>
  <path d="M71.8 189.0 A196 196 0 0 1 425.7 158.0" fill="none" stroke="#F6B23C"
        stroke-width="22" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <path d="M440.2 323.0 A196 196 0 0 1 86.3 354.0" fill="none" stroke="#F6B23C"
        stroke-width="22" stroke-linecap="butt" marker-end="url(#arrow)"/>
